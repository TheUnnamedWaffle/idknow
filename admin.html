<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SchoolIT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #fff; border-bottom: 1px solid #e0e0e0; }
        .logo { font-weight: bold; font-size: 1.2em; color: #d32f2f; display: flex; align-items: center; border: 2px solid #d32f2f; padding: 5px 10px; border-radius: 4px; text-decoration: none;}
        
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; text-align: center; }
        .stat-card h3 { margin: 0; color: #666; font-size: 1em; }
        .stat-card .number { font-size: 2.5em; font-weight: bold; color: #155bb5; margin: 10px 0 0 0; }
        .stat-card.alert .number { color: #d32f2f; }
        .stat-card.success .number { color: #2e7d32; }

        .panel { background: #fff; padding: 25px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 30px; }
        .panel h2 { margin-top: 0; color: #333; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #f8f9fa; font-weight: 600; color: #555; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; }
        .status-Resolved { background: #e8f5e9; color: #2e7d32; }
        .status-Open { background: #ffebee; color: #c62828; }
        .status-In-Progress { background: #fff8e1; color: #f57f17; }
        
        .action-select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold;}
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">🛠️ Admin Portal</a>
        <div>
            <span style="margin-right: 15px;">Welcome, IT Admin</span>
            <a href="#" onclick="logout()" style="color: #d32f2f; text-decoration: none; font-weight: bold;">Logout</a>
        </div>
    </header>

    <div class="container">
        <div class="summary-grid">
            <div class="stat-card alert">
                <h3>Open Tickets</h3>
                <p class="number" id="count-open">0</p>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <p class="number" id="count-progress">0</p>
            </div>
            <div class="stat-card success">
                <h3>Resolved</h3>
                <p class="number" id="count-resolved">0</p>
            </div>
        </div>

        <div class="panel">
            <h2>All System Tickets</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Reporter</th>
                        <th>Issue</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Admin Action</th>
                    </tr>
                </thead>
                <tbody id="admin-ticket-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Security Check
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user || user.role !== 'admin') {
                window.location.href = 'login.html';
                return;
            }
            loadAdminTickets();
        };

        function loadAdminTickets() {
            const tickets = JSON.parse(localStorage.getItem('tickets')) || [];
            const tbody = document.getElementById('admin-ticket-body');
            tbody.innerHTML = '';
            
            // Counters for the summary cards
            let open = 0, progress = 0, resolved = 0;

            if (tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No tickets in the system.</td></tr>`;
            } else {
                // Reverse the array so the newest tickets are at the top
                tickets.slice().reverse().forEach((ticket, reversedIndex) => {
                    // Because we reversed it, we need the true index in the original array to update it later
                    const trueIndex = tickets.length - 1 - reversedIndex;

                    if (ticket.status === 'Open') open++;
                    else if (ticket.status === 'In Progress') progress++;
                    else if (ticket.status === 'Resolved') resolved++;

                    const statusClass = `status-${ticket.status.replace(" ", "-")}`;

                    tbody.innerHTML += `
                        <tr>
                            <td>#${ticket.id}</td>
                            <td>${ticket.name}<br><small style="color: #666;">${ticket.email}</small></td>
                            <td>${ticket.issue}</td>
                            <td>${ticket.date}</td>
                            <td><span class="status-badge ${statusClass}">${ticket.status}</span></td>
                            <td>
                                <select class="action-select" onchange="updateTicketStatus(${trueIndex}, this.value)">
                                    <option value="Open" ${ticket.status === 'Open' ? 'selected' : ''}>Open</option>
                                    <option value="In Progress" ${ticket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                    <option value="Resolved" ${ticket.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                </select>
                            </td>
                        </tr>
                    `;
                });
            }

            // Update Summary Cards
            document.getElementById('count-open').innerText = open;
            document.getElementById('count-progress').innerText = progress;
            document.getElementById('count-resolved').innerText = resolved;
        }

        function updateTicketStatus(index, newStatus) {
            let tickets = JSON.parse(localStorage.getItem('tickets')) || [];
            tickets[index].status = newStatus; // Update the status
            localStorage.setItem('tickets', JSON.stringify(tickets)); // Save back to database
            loadAdminTickets(); // Refresh the table and counts instantly
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
