<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SchoolIT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-card h2 { color: #155bb5; margin-top: 0; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #155bb5; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0d47a1; }
        .hint { font-size: 0.85em; color: #666; margin-top: 20px; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 4px;}
    </style>
</head>
<body>

    <div class="login-card">
        <h2> SchoolIT Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div class="hint">
            <strong>Test Accounts:</strong><br>
            Admin: admin@school.edu / admin123<br>
            Student: student@school.edu / student123
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            let userRole = "";

            if (email === "admin@school.edu" && password === "admin123") {
                userRole = "admin";
            } else if (email === "student@school.edu" && password === "student123") {
                userRole = "student";
            } else {
                alert("Invalid credentials! Try the test accounts.");
                return;
            }

            const session = {
                email: email,
                role: userRole,
                name: userRole === "admin" ? "IT Administrator" : "Alex Student"
            };
            
            // Save to browser memory
            localStorage.setItem('currentUser', JSON.stringify(session));

            // Redirect
            if (userRole === "admin") {
                window.location.href = "admin.html";
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
